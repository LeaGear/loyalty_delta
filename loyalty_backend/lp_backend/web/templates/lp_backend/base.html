{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title%}Loyalty{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'lp_backend/vendors/style.css' %}">
</head>
<body>
    <header class="page-head">
        <div class="site-name">
            <div class="spacer">TEMP</div>
            <div class="page-name">CHECKER</div>
            <div>
                {% if vendor.is_authenticated %}
                    <form class="logout-form" action="{% url 'logout' %}" method="POST">
                        {% csrf_token %}
                        <button class="logout-btn" type="submit">
                            {{ vendor.username }} LOG OUT
                        </button>
                    </form>
                {% else %}
                    <form class="login-form" action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        <button class="login-btn" type="submit">
                            LOG IN
                        </button>
                    </form>
                {% endif %}
            </div>
        </div>
        <div class="site-navigation">
            <div>Navigation</div>
        </div>

    </header>
    <main class="page-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="page-footer">
        Bobiki
    </footer>
    {% if messages %}
        <input type="checkbox" id="toast-dismiss" class="toast-toggle-checkbox">
        <div class="toast-popup">
            {% for m in messages %}
                <div class="message {{ m.tags }}">{{ m }}</div>
            {% endfor %}
                <div class="to-ok-btn-div">
                    <label for="toast-dismiss" class="toast-ok-btn">OK</label>
                </div>
        </div>
    {% endif %}
</body>
</html>
