{% extends 'lp_backend/base.html' %}

{% block title%}Client Checker{% endblock %}

{% block content %}
    <div class="client-checker-window">
        <form id="user-params-form" action="{% url 'search_client' %}" method="GET" class="find-user-part">
            <div class="find-user-child">
                <label class="fuc-name-label">Name: </label>
                <label class="fuc-label">{% if user_info %}{{user_info.name}}{% else %}User{% endif %}</label>
            </div>
            <div class="find-user-child">
                <label class="fuc-label" for="field-id" >ID: </label>
                <input class="fuc-input" id="field-id"
                       name="id" type="text" maxlength="13" inputmode="numeric" pattern="[0-9]*" value="{{user_info.id}}">
                <button type="button" class="copy-btn" data-target="field-id">Copy</button>
            </div>
            <div class="find-user-child">
                <label class="fuc-label" for="field-code" >Code: </label>
                <input class="fuc-input" id="field-code"
                       name="code" type="text" maxlength="13" inputmode="numeric" pattern="[0-9]*" value="{{user_info.code}}">
                <button type="button" class="copy-btn" data-target="field-code">Copy</button>
            </div>
            <div class="find-user-child">
                <label class="fuc-label" for="field-number" >Number: </label>
                <input class="fuc-input" id="field-number"
                       name="number" type="text" maxlength="13" inputmode="numeric" pattern="[0-9]*" value="{{user_info.phone_number}}">
                <button type="button" class="copy-btn" data-target="field-number">Copy</button>
            </div>
            <div class="find-user-child">
                <button type="submit" class="submit-btn">
                    SUBMIT
                </button>
            </div>
        </form>
        <div class="user-data-part">
            <div class="data-left-side">
                <div class="total-discount">
                    <label class="tt-dis">Total spent: {{ user_info.total_spent|default:"0" }} UAH</label>
                    <label class="tt-dis">Current Discount: {{ user_info.discount|default:"0" }}%</label>
                </div>
                <div class="user-notes">
                    <ul class="note-list">
                        {% for note in user_info.notes %}
                            <li class="note-record">{{note}}</li>
                        {% endfor %}
                        <li class="note-record">

                            <form id="note-form" action="{% url 'add_note' %}" method="GET">
                                {% if user_info.id %}
                                <input type="hidden" name="client_id" value="{{ user_info.id }}">
                                {% endif %}
                                <input class="note-input" id="field-note" name="new-note" type="text">
                                <button class="add-note-btn" type="submit">
                                add note
                                </button>
                            </form>

                        </li>
                    </ul>
                </div>
            </div>
            <div class="data-right-side">
                transactions
            </div>
        </div>
    </div>
{% endblock %}
